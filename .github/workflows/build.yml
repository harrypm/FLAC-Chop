name: Build and release binary

# Mirrors the structure of harrypm/MISRC/.github/workflows/build.yml, adapted
# to FLAC-Chop's stack (Rust/cargo core + Qt6/CMake GUI + SoX runtime dep)
# instead of MISRC's Meson + raylib + hsdaoh toolchain.
#
# Triggers: push of a v* tag (release), PRs (build only, no release), and
# manual workflow_dispatch (optionally create a release from a given tag).

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub release and upload built assets"
        required: false
        type: boolean
        default: false
      release_tag:
        description: "Tag to release when manually dispatched (example: v1.2.0)"
        required: false
        type: string
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  BUILD_DIR: build-gha

jobs:
  # --- Preflight: Rust core tests on Linux (fast feedback before packaging) ---
  cargo-tests:
    name: Cargo tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ runner.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Run cargo test
        run: cargo test --release --manifest-path core/Cargo.toml

      - name: Build probe_cli (smoke check)
        run: cargo build --release --manifest-path core/Cargo.toml --example probe_cli

  # --- Linux AppImage (x86_64 + arm64) ---
  linux-appimage:
    name: Linux AppImage (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            linuxdeploy_arch: x86_64
            artifact_suffix: x86
          - arch: arm64
            runner: ubuntu-22.04-arm
            linuxdeploy_arch: aarch64
            artifact_suffix: arm64
    runs-on: ${{ matrix.runner }}
    needs: cargo-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags so the git-describe version fallback works;
          # the explicit -DFLAC_CHOP_VERSION passed to cmake below is the
          # primary version source for packaged builds.
          fetch-depth: 0

      - name: Resolve build version
        id: version
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --dirty --match 'v*' 2>/dev/null || true)"
            if [[ -z "$VERSION" ]]; then
              VERSION="dev-${GITHUB_SHA::7}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            curl \
            file \
            patchelf \
            sox \
            libsox-fmt-all \
            zip \
            unzip

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-linux-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Build FLAC-Chop
        run: |
          set -eux
          # Pass the resolved release version explicitly so the in-app
          # version (title bar, --version, update check) can never fall back
          # to "dev-<sha>" on a release build (this shipped v1.0.8 as
          # "dev-e744de2": the tagless shallow checkout broke git describe).
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_CHOP_VERSION="${{ steps.version.outputs.version }}"
          cmake --build "$BUILD_DIR"
          test -x "$BUILD_DIR/gui/flac-chop"

      - name: Verify built binary reports the release version
        run: |
          set -eux
          EXPECTED="FLAC-Chop ${{ steps.version.outputs.version }}"
          OUT="$($BUILD_DIR/gui/flac-chop --version)"
          echo "built binary reports: $OUT (expected: $EXPECTED)"
          [ "$OUT" = "$EXPECTED" ]

      - name: Package AppImage
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
          LINUXDEPLOY_ARCH: ${{ matrix.linuxdeploy_arch }}
          # ubuntu-22.04's default `qmake` on PATH is Qt5; point the linuxdeploy
          # Qt plugin at Qt6's qmake6 so it bundles Qt6 (not Qt5) libraries.
          QMAKE: /usr/bin/qmake6
        run: |
          set -eux
          mkdir -p AppDir/usr/bin
          cp "$BUILD_DIR/gui/flac-chop" AppDir/usr/bin/
          cp "$(command -v sox)" AppDir/usr/bin/sox
          chmod +x AppDir/usr/bin/sox

          # Desktop entry (StartupWMClass must match the Qt window class set in
          # gui/main.cpp) and AppRun (installs the user-level launcher + icon on
          # first GUI run) live in assets/appimage/ - kept as real files, not
          # inline heredocs, so they cannot break the workflow YAML.
          cp assets/appimage/flac-chop.desktop AppDir/flac-chop.desktop

          # AppImage tooling rejects 1024x1024 icons; use a validated 512x512
          # raster source for metadata embedding.
          cp assets/icons/flac-chop-icon-512.png AppDir/flac-chop.png

          cp assets/appimage/AppRun AppDir/AppRun
          chmod +x AppDir/AppRun

          curl -L -o linuxdeploy "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage"
          curl -L -o linuxdeploy-plugin-qt "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # Bundle Qt6 + SoX runtime deps into a single self-contained AppImage.
          ARCH="$LINUXDEPLOY_ARCH" APPIMAGE_EXTRACT_AND_RUN=1 ./linuxdeploy \
            --appdir AppDir \
            -e AppDir/usr/bin/flac-chop \
            -e AppDir/usr/bin/sox \
            -d AppDir/flac-chop.desktop \
            -i AppDir/flac-chop.png \
            --plugin qt \
            --output appimage

          APPIMAGE_NAME="linux_FLAC-Chop_${BUILD_VERSION}_${{ matrix.artifact_suffix }}.AppImage"
          mv ./*.AppImage "$APPIMAGE_NAME"
          test -f "$APPIMAGE_NAME"

      - name: Verify packaged AppImage reports the release version
        # AppRun forwards CLI args headless (no desktop integration for
        # --version); APPIMAGE_EXTRACT_AND_RUN runs it without FUSE, which
        # the GitHub runner images do not ship.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eux
          APPIMAGE_NAME="linux_FLAC-Chop_${{ steps.version.outputs.version }}_${{ matrix.artifact_suffix }}.AppImage"
          EXPECTED="FLAC-Chop ${{ steps.version.outputs.version }}"
          OUT="$(./"$APPIMAGE_NAME" --version)"
          echo "AppImage reports: $OUT (expected: $EXPECTED)"
          [ "$OUT" = "$EXPECTED" ]

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v6
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: linux_FLAC-Chop_*_${{ matrix.artifact_suffix }}.AppImage
          if-no-files-found: error

  # --- Windows EXE (x86_64 via MSYS2 MINGW64) ---
  windows-exe:
    name: Windows EXE (x86_64)
    runs-on: windows-2022
    needs: cargo-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-sox

      - name: Resolve build version
        id: version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --dirty --match 'v*' 2>/dev/null || true)"
            if [[ -z "$VERSION" ]]; then
              VERSION="dev-${GITHUB_SHA:0:7}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust (MinGW gnu toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          # MinGW gnu toolchain matches MSYS2 MINGW64's gcc and the shared
          # Qt6/sox MSYS2 packages (which are built with the same gcc).
          toolchain: stable-x86_64-pc-windows-gnu

      - name: Build FLAC-Chop
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$(cygpath -u "${CARGO_HOME:-$HOME/.cargo}")/bin:$PATH"
          cargo --version
          # Shared Qt6 + shared sox from MSYS2 MINGW64 (no static deps). The
          # runtime DLLs are bundled into the portable ZIP / installer below,
          # mirroring the arm64 job — this sidesteps the static-Qt problems.
          # Pass the resolved release version explicitly so the in-app
          # version (title bar, --version, update check) can never fall back
          # to "dev-<sha>" on a release build (this shipped v1.0.8 as
          # "dev-e744de2": the tagless shallow checkout broke git describe).
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_CHOP_VERSION="${{ steps.version.outputs.version }}"
          cmake --build "$BUILD_DIR"
          test -x "$BUILD_DIR/gui/flac-chop.exe"

      - name: Verify built exe contains the release version
        # Binary string search for the VERSION LITERAL (e.g. "v1.0.9"), not
        # the combined "FLAC-Chop v1.0.9": the exe stores the printf format
        # "FLAC-Chop %s\n" and the #define value as SEPARATE string literals,
        # so the combined string never exists as a contiguous byte sequence.
        # Also asserts the dev- fallback string is ABSENT from a release build.
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $exe = "$env:BUILD_DIR\gui\flac-chop.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "built exe binary search for '$expected'..."
          if ($text -notmatch [regex]::Escape($expected)) {
            throw "version mismatch: built exe must contain the version literal '$expected'"
          }
          # Also verify the OLD bug string is absent (never ship dev-)
          if ($text -match 'dev-[0-9a-f]{7,}' -and '$expected' -notmatch '^dev-') {
            $found = [regex]::Match($text, 'dev-[0-9a-f]{7,}').Value
            throw "CRITICAL: release exe contains '$found' — the dev- fallback leaked into a release build"
          }
          Write-Host "PASS: version literal '$expected' found in the built exe"

      - name: Bundle Qt6 DLLs with windeployqt
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$BUILD_DIR/gui/flac-chop.exe" dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/flac-chop.exe
          # Bundle SoX so users do not need a separate SoX install on PATH.
          cp "/mingw64/bin/sox.exe" dist/
          test -x dist/sox.exe

      - name: Bundle compiler-runtime + third-party DLLs (windeployqt misses these)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # MINGW64 Qt6 DLLs depend on the gcc runtime + third-party libs that
          # windeployqt does not copy; iterate ldd to a fixpoint and copy every
          # /mingw64/bin DLL into dist. Same approach as the arm64 job.
          BINDIR="/mingw64/bin"
          for pass in 1 2 3 4 5 6 7 8; do
            new=0
            while IFS= read -r d; do
              base="$(basename "$d")"
              if [ ! -f "dist/$base" ]; then cp "$d" "dist/$base"; new=$((new+1)); fi
            done < <(find dist -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
                     | xargs -0 -n1 ldd 2>/dev/null \
                     | grep -oE "${BINDIR}/[^ ]+\.dll" | sort -u)
            echo "dep-bundle pass $pass: newly copied $new DLL(s)"
            [ "$new" -eq 0 ] && break
          done
          LEAKS=$(ldd dist/flac-chop.exe 2>/dev/null | grep -E "${BINDIR}/" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::exe still has un-bundled ${BINDIR} deps:"; echo "$LEAKS"; exit 1
          fi
          SOX_MISSING=""
          while IFS= read -r sox_dll; do
            [ -z "$sox_dll" ] && continue
            if [ ! -f "dist/$sox_dll" ]; then
              SOX_MISSING+="$sox_dll"$'\n'
            fi
          done < <(ldd dist/sox.exe 2>/dev/null \
                   | grep -oE "${BINDIR}/[^ ]+\\.dll" \
                   | xargs -r -n1 basename \
                   | sort -u)
          if [ -n "$SOX_MISSING" ]; then
            STILL_MISSING=""
            while IFS= read -r sox_dll; do
              [ -z "$sox_dll" ] && continue
              if [ ! -f "dist/$sox_dll" ] && [ -f "${BINDIR}/$sox_dll" ]; then
                cp "${BINDIR}/$sox_dll" "dist/$sox_dll"
              fi
              if [ ! -f "dist/$sox_dll" ]; then
                STILL_MISSING+="$sox_dll"$'\n'
              fi
            done <<<"$SOX_MISSING"
            if [ -n "$STILL_MISSING" ]; then
              echo "::error::sox.exe is missing required bundled DLLs (not in ${BINDIR}):"
              printf '%s' "$STILL_MISSING"
              exit 1
            fi
          fi
          echo "Bundled DLLs in dist/:"
          ls -1 dist/*.dll | xargs -n1 basename | sort | sed 's/^/  /'
      - name: Create portable ZIP (extract-and-run)
        # Windows packaging rule (restored): keep a portable build in addition
        # to the installer so users can run from an extracted folder — nothing
        # is written outside it. (The 7z SFX exe this replaces showed a
        # generic "7-Zip self-extracting archive" dialog and just dumped the
        # files; the pre-SFX workflow shipped portable ZIP + Inno installer.)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ZipPath = "windows_FLAC-Chop_${version}_x86_64.zip"
          Compress-Archive -Path "dist\*" -DestinationPath $ZipPath -Force
          if (-not (Test-Path $ZipPath)) {
            throw "Portable ZIP was not generated."
          }

      - name: Create Windows installer EXE (Inno Setup)
        # assets/installer/flac-chop.iss is a real file (not an inline heredoc)
        # so it cannot break this YAML; all paths are passed as absolute /D
        # defines. Same packaging as the pre-SFX workflow (CI-green then).
        shell: pwsh
        run: |
          # ISCC's location depends on how Inno Setup arrived: choco installs
          # machine-wide to Program Files (x86); a winget/user install goes to
          # LocalAppData\Programs (verified locally with winget Inno 6.7.3).
          $isccPaths = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )
          $iscc = $isccPaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $isccPaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $iscc) {
              throw "ISCC.exe not found after attempting install."
            }
          }
          $version = "${{ steps.version.outputs.version }}"
          # VersionInfoVersion (the PE file-version resource) must be numeric:
          # take the leading vX.Y.Z of the version; dev builds get a placeholder.
          if ($version -match '^v?(\d+\.\d+\.\d+)') { $numeric = $Matches[1] } else { $numeric = "0.0.0.1" }
          $root = $env:GITHUB_WORKSPACE
          $issArgs = @(
            "/Qp",
            "/DFLAC_CHOP_APP_VERSION=$version",
            "/DFLAC_CHOP_NUMERIC_VERSION=$numeric",
            "/DFLAC_CHOP_ARCH_SUFFIX=x86_64",
            "/DFLAC_CHOP_DIST_DIR=$(Join-Path $root 'dist')",
            "/DFLAC_CHOP_ICON_FILE=$(Join-Path $root 'assets\icons\flac-chop-icon.ico')",
            "/DFLAC_CHOP_OUTPUT_DIR=$root",
            "assets\installer\flac-chop.iss"
          )
          & $iscc @issArgs
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path "windows_FLAC-Chop_${version}_x86_64.exe")) {
            throw "Installer EXE was not generated."
          }

      - name: Verify packaged artifacts (version, layout, install + uninstall)
        # CI packaging tests: binary string search for the VERSION LITERAL
        # (the exe stores the format and version as separate string literals,
        # so searching for the combined "FLAC-Chop v1.0.9" never matches),
        # portable ZIP layout, and installer install + uninstall.
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ZipPath = "windows_FLAC-Chop_${version}_x86_64.zip"
          $ExePath = (Resolve-Path "windows_FLAC-Chop_${version}_x86_64.exe").Path

          # --- portable ZIP: extract, binary-search the inner exe, check the layout ---
          $portTest = Join-Path $env:RUNNER_TEMP "portable-test"
          if (Test-Path $portTest) { Remove-Item $portTest -Recurse -Force }
          Expand-Archive -Path $ZipPath -DestinationPath $portTest
          $portExe = Join-Path $portTest "flac-chop.exe"
          $bytes = [System.IO.File]::ReadAllBytes($portExe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "portable exe binary search for '$version'..."
          if ($text -notmatch [regex]::Escape($version)) {
            throw "portable ZIP: version mismatch — '$version' not found in the inner exe"
          }
          Write-Host "PASS: version literal '$version' found in the portable ZIP's inner exe"
          foreach ($f in @("sox.exe", "Qt6Widgets.dll", "platforms\qwindows.dll")) {
            if (-not (Test-Path (Join-Path $portTest $f))) {
              throw "portable ZIP: missing $f"
            }
          }

          # --- installer: silent install, verify, silent uninstall ---
          $instDir = Join-Path $env:RUNNER_TEMP "installer-test"
          $p = Start-Process -FilePath $ExePath -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$instDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer: silent install failed ($($p.ExitCode))" }
          $instExe = Join-Path $instDir "flac-chop.exe"
          $bytes2 = [System.IO.File]::ReadAllBytes($instExe)
          $text2 = [System.Text.Encoding]::ASCII.GetString($bytes2)
          Write-Host "installed exe binary search for '$version'..."
          if ($text2 -notmatch [regex]::Escape($version)) {
            throw "installer: version mismatch — '$version' not found in the installed exe"
          }
          Write-Host "PASS: version literal '$version' found in the installed exe"
          foreach ($f in @("sox.exe", "platforms\qwindows.dll")) {
            if (-not (Test-Path (Join-Path $instDir $f))) {
              throw "installer: missing $f"
            }
          }
          $unins = Join-Path $instDir "unins000.exe"
          if (-not (Test-Path $unins)) { throw "installer: uninstaller not found" }
          $u = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "installer: silent uninstall failed ($($u.ExitCode))" }

      - name: Upload Windows x86_64 portable ZIP + installer EXE
        uses: actions/upload-artifact@v6
        with:
          name: windows-x86_64
          path: |
            windows_FLAC-Chop_*_x86_64.zip
            windows_FLAC-Chop_*_x86_64.exe
          if-no-files-found: error

  # --- Windows EXE (arm64 via MSYS2 CLANGARM64, native on windows-11-arm) ---
  windows-arm64:
    name: Windows EXE (arm64)
    runs-on: windows-11-arm
    needs: cargo-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            git
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-qt6-base
            mingw-w64-clang-aarch64-qt6-tools
            mingw-w64-clang-aarch64-sox

      - name: Resolve build version
        id: version
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --dirty --match 'v*' 2>/dev/null || true)"
            if [[ -z "$VERSION" ]]; then
              VERSION="dev-${GITHUB_SHA:0:7}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Rust (aarch64 gnullvm toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          # aarch64-pc-windows-gnullvm = the LLVM-mingw arm64 ABI, which
          # matches MSYS2's CLANGARM64 Qt6 (built against the LLVM-mingw
          # runtime). The MSVC target would ABI-mismatch and fail to link.
          # Installing it as the job's default toolchain means `cargo build
          # --release` (no --target) builds for gnullvm and lands the
          # staticlib at core/target/release/libflac_chop_core.a, matching
          # gui/CMakeLists.txt (which uses .a for every non-MSVC toolchain).
          toolchain: stable-aarch64-pc-windows-gnullvm

      - name: Build FLAC-Chop
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # cargo/rustc are installed by dtolnay/rust-toolchain into the Windows
          # CARGO_HOME; cmake's custom command spawns `cargo` via cmd.exe which
          # does not inherit dtolnay's GITHUB_PATH under the MSYS2 shell, so
          # convert CARGO_HOME to an MSYS2 path and prepend its bin (same fix
          # as the x86_64 job).
          export PATH="$(cygpath -u "${CARGO_HOME:-$HOME/.cargo}")/bin:$PATH"
          cargo --version
          # Pass the resolved release version explicitly so the in-app
          # version (title bar, --version, update check) can never fall back
          # to "dev-<sha>" on a release build (this shipped v1.0.8 as
          # "dev-e744de2": the tagless shallow checkout broke git describe).
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_CHOP_VERSION="${{ steps.version.outputs.version }}"
          cmake --build "$BUILD_DIR"
          test -x "$BUILD_DIR/gui/flac-chop.exe"

      - name: Verify built exe contains the release version
        # Binary string search for the VERSION LITERAL (same rationale as the
        # x86_64 job): the WIN32-subsystem exe cannot print in a headless CI
        # runner, and the exe stores the format and version as separate literals.
        shell: pwsh
        run: |
          $expected = "${{ steps.version.outputs.version }}"
          $exe = "$env:BUILD_DIR\gui\flac-chop.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "built exe binary search for '$expected'..."
          if ($text -notmatch [regex]::Escape($expected)) {
            throw "version mismatch: built exe must contain the version literal '$expected'"
          }
          if ($text -match 'dev-[0-9a-f]{7,}' -and '$expected' -notmatch '^dev-') {
            $found = [regex]::Match($text, 'dev-[0-9a-f]{7,}').Value
            throw "CRITICAL: release exe contains '$found' — the dev- fallback leaked into a release build"
          }
          Write-Host "PASS: version literal '$expected' found in the built exe"

      - name: Bundle Qt6 DLLs with windeployqt
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$BUILD_DIR/gui/flac-chop.exe" dist/
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw dist/flac-chop.exe
          # Bundle SoX for Windows artifacts so users do not need a separate
          # SoX install on PATH.
          cp "/clangarm64/bin/sox.exe" dist/
          test -x dist/sox.exe

      - name: Bundle compiler-runtime + third-party DLLs (windeployqt misses these)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # Same rationale as the x86_64 job. CLANGARM64 Qt6 DLLs depend on the
          # LLVM-mingw compiler runtime + third-party libs that windeployqt does
          # not copy; iterate ldd to a fixpoint and copy every /clangarm64/bin
          # DLL into dist.
          BINDIR="/clangarm64/bin"
          for pass in 1 2 3 4 5 6 7 8; do
            new=0
            while IFS= read -r d; do
              base="$(basename "$d")"
              if [ ! -f "dist/$base" ]; then cp "$d" "dist/$base"; new=$((new+1)); fi
            done < <(find dist -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0 \
                     | xargs -0 -n1 ldd 2>/dev/null \
                     | grep -oE "${BINDIR}/[^ ]+\.dll" | sort -u)
            echo "dep-bundle pass $pass: newly copied $new DLL(s)"
            [ "$new" -eq 0 ] && break
          done
          LEAKS=$(ldd dist/flac-chop.exe 2>/dev/null | grep -E "${BINDIR}/" || true)
          if [ -n "$LEAKS" ]; then
            echo "::error::exe still has un-bundled ${BINDIR} deps:"; echo "$LEAKS"; exit 1
          fi
          # ldd may still resolve DLLs to ${BINDIR} even when matching DLLs are
          # present in dist/. Validate by basename presence in dist/ instead.
          SOX_MISSING=""
          while IFS= read -r sox_dll; do
            [ -z "$sox_dll" ] && continue
            if [ ! -f "dist/$sox_dll" ]; then
              SOX_MISSING+="$sox_dll"$'\n'
            fi
          done < <(ldd dist/sox.exe 2>/dev/null \
                   | grep -oE "${BINDIR}/[^ ]+\\.dll" \
                   | xargs -r -n1 basename \
                   | sort -u)
          if [ -n "$SOX_MISSING" ]; then
            # The ldd-walk above can miss a sox dep whose ldd-reported path
            # didn't match ${BINDIR}; copy each missing one straight from
            # ${BINDIR} before failing. Only fail if it's genuinely absent
            # from the MSYS2 install (sox.exe wouldn't run anyway).
            STILL_MISSING=""
            while IFS= read -r sox_dll; do
              [ -z "$sox_dll" ] && continue
              if [ ! -f "dist/$sox_dll" ] && [ -f "${BINDIR}/$sox_dll" ]; then
                cp "${BINDIR}/$sox_dll" "dist/$sox_dll"
              fi
              if [ ! -f "dist/$sox_dll" ]; then
                STILL_MISSING+="$sox_dll"$'\n'
              fi
            done <<<"$SOX_MISSING"
            if [ -n "$STILL_MISSING" ]; then
              echo "::error::sox.exe is missing required bundled DLLs (not in ${BINDIR}):"
              printf '%s' "$STILL_MISSING"
              exit 1
            fi
          fi
          echo "Bundled DLLs in dist/:"
          ls -1 dist/*.dll | xargs -n1 basename | sort | sed 's/^/  /'
      - name: Create portable ZIP (extract-and-run)
        # Same Windows packaging rule as the x86_64 job: a portable ZIP in
        # addition to the installer. (Replaces the generic 7z SFX exe.)
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ZipPath = "windows_FLAC-Chop_${version}_arm64.zip"
          Compress-Archive -Path "dist\*" -DestinationPath $ZipPath -Force
          if (-not (Test-Path $ZipPath)) {
            throw "Portable ZIP was not generated."
          }

      - name: Create Windows installer EXE (Inno Setup)
        # ISCC runs under x86 emulation on the ARM64 runner (same packaging
        # as the pre-SFX workflow, which was CI-green on windows-11-arm).
        shell: pwsh
        run: |
          # ISCC's location depends on how Inno Setup arrived (choco:
          # Program Files (x86); winget/user: LocalAppData\Programs).
          $isccPaths = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )
          $iscc = $isccPaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $isccPaths | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
            if (-not $iscc) {
              throw "ISCC.exe not found after attempting install."
            }
          }
          $version = "${{ steps.version.outputs.version }}"
          # VersionInfoVersion (the PE file-version resource) must be numeric:
          # take the leading vX.Y.Z of the version; dev builds get a placeholder.
          if ($version -match '^v?(\d+\.\d+\.\d+)') { $numeric = $Matches[1] } else { $numeric = "0.0.0.1" }
          $root = $env:GITHUB_WORKSPACE
          $issArgs = @(
            "/Qp",
            "/DFLAC_CHOP_APP_VERSION=$version",
            "/DFLAC_CHOP_NUMERIC_VERSION=$numeric",
            "/DFLAC_CHOP_ARCH_SUFFIX=arm64",
            "/DFLAC_CHOP_DIST_DIR=$(Join-Path $root 'dist')",
            "/DFLAC_CHOP_ICON_FILE=$(Join-Path $root 'assets\icons\flac-chop-icon.ico')",
            "/DFLAC_CHOP_OUTPUT_DIR=$root",
            "assets\installer\flac-chop.iss"
          )
          & $iscc @issArgs
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path "windows_FLAC-Chop_${version}_arm64.exe")) {
            throw "Installer EXE was not generated."
          }

      - name: Verify packaged artifacts (version, layout, install + uninstall)
        # Binary string search for the VERSION LITERAL (same rationale as the
        # x86_64 job).
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ZipPath = "windows_FLAC-Chop_${version}_arm64.zip"
          $ExePath = (Resolve-Path "windows_FLAC-Chop_${version}_arm64.exe").Path

          # --- portable ZIP: extract, binary-search the inner exe, check the layout ---
          $portTest = Join-Path $env:RUNNER_TEMP "portable-test"
          if (Test-Path $portTest) { Remove-Item $portTest -Recurse -Force }
          Expand-Archive -Path $ZipPath -DestinationPath $portTest
          $portExe = Join-Path $portTest "flac-chop.exe"
          $bytes = [System.IO.File]::ReadAllBytes($portExe)
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          Write-Host "portable exe binary search for '$version'..."
          if ($text -notmatch [regex]::Escape($version)) {
            throw "portable ZIP: version mismatch — '$version' not found in the inner exe"
          }
          Write-Host "PASS: version literal '$version' found in the portable ZIP's inner exe"
          foreach ($f in @("sox.exe", "Qt6Widgets.dll", "platforms\qwindows.dll")) {
            if (-not (Test-Path (Join-Path $portTest $f))) {
              throw "portable ZIP: missing $f"
            }
          }

          # --- installer: silent install, verify, silent uninstall ---
          $instDir = Join-Path $env:RUNNER_TEMP "installer-test"
          $p = Start-Process -FilePath $ExePath -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$instDir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer: silent install failed ($($p.ExitCode))" }
          $instExe = Join-Path $instDir "flac-chop.exe"
          $bytes2 = [System.IO.File]::ReadAllBytes($instExe)
          $text2 = [System.Text.Encoding]::ASCII.GetString($bytes2)
          Write-Host "installed exe binary search for '$version'..."
          if ($text2 -notmatch [regex]::Escape($version)) {
            throw "installer: version mismatch — '$version' not found in the installed exe"
          }
          Write-Host "PASS: version literal '$version' found in the installed exe"
          foreach ($f in @("sox.exe", "platforms\qwindows.dll")) {
            if (-not (Test-Path (Join-Path $instDir $f))) {
              throw "installer: missing $f"
            }
          }
          $unins = Join-Path $instDir "unins000.exe"
          if (-not (Test-Path $unins)) { throw "installer: uninstaller not found" }
          $u = Start-Process -FilePath $unins -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "installer: silent uninstall failed ($($u.ExitCode))" }

      - name: Upload Windows arm64 portable ZIP + installer EXE
        uses: actions/upload-artifact@v6
        with:
          name: windows-arm64
          path: |
            windows_FLAC-Chop_*_arm64.zip
            windows_FLAC-Chop_*_arm64.exe
          if-no-files-found: error

  # --- macOS APP (arm64 + x86_64, then universal DMG) ---
  macos-app-build:
    name: macOS APP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    needs: cargo-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve build version
        id: version
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.release_tag }}" ]]; then
            VERSION="${{ github.event.inputs.release_tag }}"
          else
            VERSION="$(git describe --tags --dirty --match 'v*' 2>/dev/null || true)"
            if [[ -z "$VERSION" ]]; then
              VERSION="dev-${GITHUB_SHA::7}"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -eux
          # The macOS runner image ships an untrusted `aws/tap` that makes
          # every brew command print a tap-trust warning. We don't use it —
          # untap it (best-effort) so brew runs clean.
          brew untap aws/tap 2>/dev/null || true
          brew install cmake ninja qt@6 pkg-config sox
          # qt@6 is keg-only; force-link it so cmake finds qmake6 on the brew
          # prefix. The runner image now ships qt@6 already force-linked, so
          # guard the link to avoid the "Already linked" warning — only link
          # when the qmake6 symlink is missing.
          if [ ! -x "$(brew --prefix)/bin/qmake6" ]; then
            brew link --force qt@6
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Build FLAC-Chop
        run: |
          set -eux
          # Make cmake find the keg-only Qt@6.
          export CMAKE_PREFIX_PATH="$(brew --prefix qt@6):${CMAKE_PREFIX_PATH:-}"
          # Pass the resolved release version explicitly so the in-app
          # version (title bar, --version, update check) can never fall back
          # to "dev-<sha>" on a release build (this shipped v1.0.8 as
          # "dev-e744de2": the tagless shallow checkout broke git describe).
          cmake -S . -B "$BUILD_DIR" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_CHOP_VERSION="${{ steps.version.outputs.version }}"
          cmake --build "$BUILD_DIR"
          test -x "$BUILD_DIR/gui/flac-chop"

      - name: Verify built binary reports the release version
        run: |
          set -eux
          EXPECTED="FLAC-Chop ${{ steps.version.outputs.version }}"
          OUT="$($BUILD_DIR/gui/flac-chop --version)"
          echo "built binary reports: $OUT (expected: $EXPECTED)"
          [ "$OUT" = "$EXPECTED" ]

      - name: Stage .app bundle
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          APP_ROOT="dist/FLAC-Chop.app/Contents"
          mkdir -p "$APP_ROOT/MacOS" "$APP_ROOT/Resources"
          cp "$BUILD_DIR/gui/flac-chop" "$APP_ROOT/MacOS/FLAC-Chop"
          chmod +x "$APP_ROOT/MacOS/FLAC-Chop"
          # Build a proper macOS app icon from the checked-in source PNG.
          ICON_SRC="assets/icons/flac-chop-icon.png"
          ICONSET_DIR="dist/FLAC-Chop.iconset"
          rm -rf "$ICONSET_DIR"
          mkdir -p "$ICONSET_DIR"
          sips -z 16 16     "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16.png"
          sips -z 32 32     "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16@2x.png"
          sips -z 32 32     "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32.png"
          sips -z 64 64     "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32@2x.png"
          sips -z 128 128   "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128.png"
          sips -z 256 256   "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128@2x.png"
          sips -z 256 256   "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256.png"
          sips -z 512 512   "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256@2x.png"
          sips -z 512 512   "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512.png"
          sips -z 1024 1024 "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET_DIR" -o "$APP_ROOT/Resources/FLAC-Chop.icns"

          cat > "$APP_ROOT/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>FLAC-Chop</string>
            <key>CFBundleDisplayName</key>
            <string>FLAC-Chop</string>
            <key>CFBundleIdentifier</key>
            <string>dev.flacchop.gui</string>
            <key>CFBundleVersion</key>
            <string>${BUILD_VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${BUILD_VERSION}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleExecutable</key>
            <string>FLAC-Chop</string>
            <key>CFBundleIconFile</key>
            <string>FLAC-Chop.icns</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
          </dict>
          </plist>
          EOF

          # Bundle Qt frameworks into the .app so it's self-contained.
          macdeployqt "dist/FLAC-Chop.app"
          # Bundle SoX and its non-system dylib dependencies into the app.
          mkdir -p "$APP_ROOT/Frameworks"
          SOX_BIN="$(brew --prefix sox)/bin/sox"
          cp "$SOX_BIN" "$APP_ROOT/MacOS/sox"
          chmod +x "$APP_ROOT/MacOS/sox"
          # macOS ships bash 3.2 as /bin/bash, which lacks the `mapfile`
          # builtin (added in bash 4.0) — using it made both macOS arch jobs
          # fail with "mapfile: command not found" (exit 127). Populate the
          # array with a portable while-read loop instead.
          SOX_DEPS=()
          while IFS= read -r dep; do
            [ -n "$dep" ] || continue
            SOX_DEPS+=("$dep")
          done < <(otool -L "$SOX_BIN" \
            | awk 'NR>1 {print $1}' \
            | grep -E '^/opt/homebrew/|^/usr/local/' || true)
          for dep in "${SOX_DEPS[@]}"; do
            [ -n "$dep" ] || continue
            cp -f "$dep" "$APP_ROOT/Frameworks/$(basename "$dep")"
          done
          for lib in "$APP_ROOT/Frameworks/"*.dylib; do
            [ -e "$lib" ] || continue
            base="$(basename "$lib")"
            install_name_tool -id "@executable_path/../Frameworks/$base" "$lib"
          done
          for bin in "$APP_ROOT/MacOS/sox" "$APP_ROOT/Frameworks/"*.dylib; do
            [ -e "$bin" ] || continue
            while IFS= read -r dep; do
              [ -n "$dep" ] || continue
              base="$(basename "$dep")"
              if [ -f "$APP_ROOT/Frameworks/$base" ]; then
                install_name_tool -change "$dep" "@executable_path/../Frameworks/$base" "$bin"
              fi
            done < <(otool -L "$bin" \
                     | awk 'NR>1 {print $1}' \
                     | grep -E '^/opt/homebrew/|^/usr/local/' || true)
          done
          "$APP_ROOT/MacOS/sox" --version

          echo "$BUILD_VERSION" > dist/BUILD_VERSION.txt

      - name: Verify staged .app reports the release version
        env:
          BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eux
          EXPECTED="FLAC-Chop ${BUILD_VERSION}"
          OUT="$(./dist/FLAC-Chop.app/Contents/MacOS/FLAC-Chop --version)"
          echo "staged .app reports: $OUT (expected: $EXPECTED)"
          [ "$OUT" = "$EXPECTED" ]

      - name: Upload macOS architecture stage
        uses: actions/upload-artifact@v6
        with:
          name: macos-app-stage-${{ matrix.arch }}
          path: |
            dist/FLAC-Chop.app
            dist/BUILD_VERSION.txt
          if-no-files-found: error

  macos-app-universal:
    name: macOS APP (universal)
    runs-on: macos-15
    needs: macos-app-build
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Download arm64 stage
        uses: actions/download-artifact@v8
        with:
          name: macos-app-stage-arm64
          path: stage-arm64
      - name: Download x86_64 stage
        uses: actions/download-artifact@v8
        with:
          name: macos-app-stage-x86_64
          path: stage-x86_64

      - name: Merge universal app and package DMG
        id: package
        run: |
          set -eux
          BUILD_VERSION="$(cat stage-arm64/BUILD_VERSION.txt)"
          echo "version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"

          mkdir -p dist
          cp -R stage-arm64/FLAC-Chop.app dist/FLAC-Chop.app

          # Lipo-merge the Mach-O binaries; copy non-binary files from arm64.
          while IFS= read -r rel; do
            ARM_FILE="stage-arm64/${rel}"
            X86_FILE="stage-x86_64/${rel}"
            OUT_FILE="dist/${rel}"
            if file "$ARM_FILE" | grep -q "Mach-O"; then
              lipo -create "$ARM_FILE" "$X86_FILE" -output "$OUT_FILE"
            else
              cp "$ARM_FILE" "$OUT_FILE"
            fi
          done < <(cd stage-arm64 && find FLAC-Chop.app -type f | sort)
          chmod +x dist/FLAC-Chop.app/Contents/MacOS/FLAC-Chop

          # lipo-merging invalidates the per-arch code signatures that
          # macdeployqt applied. Re-sign leaf code (dylibs/so + frameworks)
          # then the bundle. Avoid `codesign --deep`: it fails on the Qt
          # frameworks with "bundle format is ambiguous (could be app or
          # framework)".
          find "dist/FLAC-Chop.app" -type f \( -name "*.dylib" -o -name "*.so" \) -print0 \
            | while IFS= read -r -d "" f; do codesign --force --sign - "$f"; done
          find "dist/FLAC-Chop.app/Contents/Frameworks" -maxdepth 1 -name "*.framework" -type d -print0 \
            | while IFS= read -r -d "" fw; do
                name="$(basename "$fw" .framework)"
                bin="$fw/Versions/Current/$name"
                # Sign the framework executable directly. Signing the
                # .framework bundle dir fails on some Qt6 frameworks with
                # "bundle format is ambiguous"; signing the inner binary
                # avoids that check. Skip data-only frameworks (no binary).
                if [ -f "$bin" ]; then
                  codesign --force --sign - "$bin"
                fi
              done
          # Sign the bundled sox helper BEFORE the main executable. codesign
          # validates sibling Mach-Os in MacOS/ when signing the main exe and
          # fails with "In subcomponent: sox" if sox is still unsigned.
          if [ -f "dist/FLAC-Chop.app/Contents/MacOS/sox" ]; then
            codesign --force --sign - "dist/FLAC-Chop.app/Contents/MacOS/sox"
          fi
          find "dist/FLAC-Chop.app/Contents/MacOS" -type f -print0 \
            | while IFS= read -r -d "" bin; do
                if file "$bin" | grep -q "Mach-O"; then
                  codesign --force --sign - "$bin"
                fi
              done
          codesign --force --sign - "dist/FLAC-Chop.app"

          # Verify both arches are present.
          LIPO_ARCHS="$(lipo -archs dist/FLAC-Chop.app/Contents/MacOS/FLAC-Chop)"
          echo "$LIPO_ARCHS" | grep -q 'arm64'
          echo "$LIPO_ARCHS" | grep -q 'x86_64'

          DMG_STAGE_DIR="dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          cp -R dist/FLAC-Chop.app "$DMG_STAGE_DIR/FLAC-Chop.app"
          ln -s /Applications "$DMG_STAGE_DIR/Applications"
          DMG_NAME="macos_FLAC-Chop_${BUILD_VERSION}_universal.dmg"
          # Retry hdiutil: "Resource busy" is a transient runner issue (a
          # volume stuck from a previous step — observed on the first
          # v1.0.9 tag run).
          for dmg_attempt in 1 2 3; do
            if hdiutil create \
              -volname "FLAC-Chop" \
              -srcfolder "$DMG_STAGE_DIR" \
              -ov \
              -format UDZO \
              "$DMG_NAME"; then
              break
            fi
            echo "hdiutil attempt $dmg_attempt failed; retrying..."
            rm -f "$DMG_NAME"
            hdiutil detach "/Volumes/FLAC-Chop" 2>/dev/null || true
            sleep 5
            if [ "$dmg_attempt" = 3 ]; then
              echo "::error::hdiutil create failed after 3 attempts"
              exit 1
            fi
          done
          test -f "$DMG_NAME"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-app
          path: macos_FLAC-Chop_*_universal.dmg
          if-no-files-found: error

  # --- Real-world data tests: probe + cut on real-format .lds + FLAC data ---
  real-world-data-tests:
    name: Real-world data tests
    runs-on: ubuntu-22.04
    needs: cargo-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install sox
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y sox libsox-fmt-all

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo integration tests with sox (the real cut pipeline)
        # The .lds integration tests (probe + full cut + non-aligned partial
        # cut + 12-bit + rate/bits conversion) skip without sox on the
        # cargo-tests runner (no sox there by design). This job HAS sox,
        # so they actually execute the full pipeline.
        run: |
          set -eux
          cargo test --release --manifest-path core/Cargo.toml --test lds_integration

      - name: Build the Rust core example CLIs
        # The core examples (probe_cli, chop_cli) test the same probe/cut
        # pipeline as the Qt CLI — without the Qt/cmake dependency (the
        # ubuntu-22.04 runner's qt6-base-dev cmake config can fail on
        # Qt6Gui). The examples link the same Rust core the Qt CLI uses.
        run: |
          set -eux
          cargo build --release --manifest-path core/Cargo.toml \
            --example probe_cli --example chop_cli --example chop_convert_cli

      - name: Test .lds probe on synthetic real-format data
        # Build a real-format .lds file with the reference ld-lds-converter
        # layout (4 samples packed into 5 bytes, 10-bit values centred at
        # 512), then probe it with the Rust core (the same probe the Qt
        # CLI uses). Verify format, rate, and totals.
        run: |
          set -eux
          python3 -c "
          data = bytearray()
          for i in range(10000):
              v = [ (i * 37 + j * 111) % 1024 for j in range(4) ]
              w0, w1, w2, w3 = v[0], v[1], v[2], v[3]
              b0 = (w0 >> 2) & 0xFF
              b1 = ((w0 & 0x03) << 6) | ((w1 >> 4) & 0x3F)
              b2 = ((w1 & 0x0F) << 4) | ((w2 >> 6) & 0x0F)
              b3 = ((w2 & 0x3F) << 2) | ((w3 >> 8) & 0x03)
              b4 = w3 & 0xFF
              data.extend([b0, b1, b2, b3, b4])
          with open('test_10msps.lds', 'wb') as f:
              f.write(data)
          print(f'Created test_10msps.lds: {len(data)} bytes = 40000 samples')
          "

          PROBE_CLI=core/target/release/examples/probe_cli
          "$PROBE_CLI" test_10msps.lds > probe_out.txt 2>&1
          cat probe_out.txt
          # The probe_cli example prints raw field names (bits_per_sample: 10),
          # not the Qt CLI's format labels (packed 10-bit lds). Grep the
          # raw values: 10 bits, 10000 Hz header rate, 40000 total samples.
          grep -q 'bits_per_sample.*10' probe_out.txt
          grep -q '10000' probe_out.txt
          grep -q '40000' probe_out.txt
          echo "PASS: .lds probe (format, rate, totals)"

      - name: Test .lds full cut + partial cut + 12-bit + conversion
        # Run the chop pipeline on the real-format .lds data: full cut,
        # non-aligned partial cut, 12-bit output, and rate/bits conversion.
        # Uses the chop_cli example (the same SoX pipeline the Qt CLI runs).
        run: |
          set -eux
          PROBE_CLI=core/target/release/examples/probe_cli
          CHOP_CLI=core/target/release/examples/chop_cli
          CONV_CLI=core/target/release/examples/chop_convert_cli

          # Full cut
          "$CHOP_CLI" test_10msps.lds test_lds_out.flac 0 4
          test -f test_lds_out.flac
          soxi test_lds_out.flac | grep -q '40000 samples'
          echo "PASS: .lds full cut"

          # Verify the cut with the probe CLI
          "$PROBE_CLI" test_lds_out.flac > cut_check.txt 2>&1
          cat cut_check.txt
          grep -q '40000' cut_check.txt
          echo "PASS: .lds full cut verified by probe"

          # Non-aligned partial cut (start 5001, len 3777)
          "$CHOP_CLI" test_10msps.lds test_lds_partial.flac 1.25 0.94425
          test -f test_lds_partial.flac
          soxi test_lds_partial.flac | grep -q '3777 samples'
          echo "PASS: .lds partial cut (non-aligned start)"

          # Rate + bits conversion (10msps 8-bit — the GUI batch setting)
          "$CONV_CLI" test_10msps.lds test_lds_conv.flac 0 4 10000 8 1
          test -f test_lds_conv.flac
          soxi test_lds_conv.flac | grep -q '40000 samples'
          echo "PASS: .lds resample + bit conversion"

      - name: Test FLAC probe + cut on a real-format file
        # Create a real FLAC RF capture with sox (noise at the /1000 header
        # rate — the actual RF convention), then probe + cut it.
        run: |
          set -eux
          # Generate a 1-second 10msps RF-style FLAC: 10000 Hz header rate,
          # 8-bit mono noise (compressed well)
          sox -r 10000 -b 8 -c 1 -n test_rf.flac synth 1 brownnoise
          test -f test_rf.flac

          PROBE_CLI=core/target/release/examples/probe_cli
          CHOP_CLI=core/target/release/examples/chop_cli

          # Probe — verify the RF rate resolution (10000 Hz header -> 10 MSPS)
          "$PROBE_CLI" test_rf.flac > rf_probe.txt 2>&1
          cat rf_probe.txt
          grep -q '10000' rf_probe.txt
          echo "PASS: FLAC probe (RF rate resolution)"

          # Cut a window
          "$CHOP_CLI" test_rf.flac test_rf_out.flac 0 0.5
          test -f test_rf_out.flac
          soxi test_rf_out.flac | grep -q '5000 samples'
          echo "PASS: FLAC cut"

      - name: Test raw PCM probe + cut on real-format data
        # Create a real-format raw PCM capture (headerless u8 RF — the cxadc
        # convention), then probe + cut it.
        run: |
          set -eux
          # Generate a raw u8 capture with the msps name hint
          sox -r 10000 -b 8 -c 1 -n test_rf_8-bit_10msps.u8 synth 0.5 brownnoise
          test -f test_rf_8-bit_10msps.u8

          PROBE_CLI=core/target/release/examples/probe_cli
          CHOP_CLI=core/target/release/examples/chop_cli

          # Probe — verify format, rate, and totals
          "$PROBE_CLI" test_rf_8-bit_10msps.u8 > raw_probe.txt 2>&1
          cat raw_probe.txt
          grep -q '10000' raw_probe.txt
          grep -q '5000' raw_probe.txt
          echo "PASS: raw PCM probe (format, rate, totals)"

          # Cut
          "$CHOP_CLI" test_rf_8-bit_10msps.u8 test_raw_out.flac 0 0.25
          test -f test_raw_out.flac
          soxi test_raw_out.flac | grep -q '2500 samples'
          echo "PASS: raw PCM cut"

  # --- Release: publish build assets to a GH release on tag push ---
  release:
    name: Publish release assets
    runs-on: ubuntu-22.04
    needs:
      - linux-appimage
      - windows-exe
      - windows-arm64
      - macos-app-universal
      - real-world-data-tests
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Resolve release tag
        id: tag
        run: |
          set -eux
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.release_tag }}"
            if [[ -z "$TAG" ]]; then
              echo "release_tag is required when create_release=true" >&2
              exit 1
            fi
            if ! git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag "$TAG" "$GITHUB_SHA"
              git push origin "$TAG"
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compose release notes (auto highlights)
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -eux
          # Base for the changelog range: the closest preceding v* tag.
          # (deps-* tags are dep caches, not releases — never match them.)
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="${PREV}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          features=""; fixes=""; others=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sha="${line%%$'\t'*}"
            s="${line#*$'\t'}"
            first=$(printf '%s' "$s" | cut -d' ' -f1 | tr '[:upper:]' '[:lower:]' | tr -d ':,')
            # Strip a conventional-commit prefix (feat:/fix:/docs(scope):) for display.
            clean=$(printf '%s' "$s" | sed -E 's/^[a-z]+(\([^)]*\))?:[[:space:]]+//I')
            # Release info lists CODE changes. A commit that touches only docs /
            # CI / metadata (readme.md, dev_notes.md, .github/*, FUNDING.yml, …)
            # is left out — unless its subject marks it critical, e.g.
            # "docs: critical — new install steps", which is release info users
            # must see. Code = core/ or gui/ sources, CMake/build.rs, deps.
            code=$(git diff-tree --no-commit-id --name-only -r "$sha" \
              | grep -E '^(core/|gui/|CMakeLists\.txt|build\.rs|deps/)' \
              | grep -vE '\.md$' | head -n 1 || true)
            if [ -z "$code" ] \
              && ! printf '%s' "$s" | grep -qiE 'critical|breaking'; then
              continue
            fi
            case "$first" in
              feat|feature|add|adds|support|implement|new|initial)
                features="${features}- ${clean}\n" ;;
              fix|fixes|repair|correct|corrects|resolve|resolves|restore|handle|patch)
                fixes="${fixes}- ${clean}\n" ;;
              *)
                others="${others}- ${clean}\n" ;;
            esac
          done < <(git log --no-merges --format='%H%x09%s' "$RANGE")

          {
            echo '> [!NOTE]'
            echo '> Published release artifacts are self-contained builds with bundled'
            echo '> SoX and required runtime dependencies — no separate SoX install needed.'
            echo
            # printf '%b' (never a bare variable format): a bullet string
            # starts with "- ", which printf would parse as an option.
            [ -n "$features" ] && { echo '## ✨ Features'; printf '%b' "$features"; echo; }
            [ -n "$fixes" ] && { echo '## 🐛 Bug Fixes'; printf '%b' "$fixes"; echo; }
            [ -n "$others" ] && { echo '## 🛠 Other changes'; printf '%b' "$others"; echo; }
            if [ -n "$PREV" ]; then
              echo '**Full Changelog**: https://github.com/${{ github.repository }}/compare/'"${PREV}...${TAG}"''
            fi
          } > release-notes.md
          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release-assets/**/linux_FLAC-Chop_*_x86.AppImage
            release-assets/**/linux_FLAC-Chop_*_arm64.AppImage
            release-assets/**/windows_FLAC-Chop_*_x86_64.exe
            release-assets/**/windows_FLAC-Chop_*_x86_64.zip
            release-assets/**/windows_FLAC-Chop_*_arm64.exe
            release-assets/**/windows_FLAC-Chop_*_arm64.zip
            release-assets/**/macos_FLAC-Chop_*_universal.dmg
