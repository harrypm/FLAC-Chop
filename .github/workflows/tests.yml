name: Tests

# Fast cargo-test feedback on push/PR to master across Linux, macOS, Windows.
# The full packaging build (build.yml) only runs on tags/PRs and is heavier;
# this catches Rust-core regressions quickly without Qt6/cmake setup.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  cargo-test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-test-${{ matrix.os }}-${{ hashFiles('core/Cargo.lock') }}

      - name: Setup MSYS2 + SoX (Windows)
        # MSYS2's MinGW64 SoX — the exact build the Windows artifacts bundle.
        # choco's sox.portable shim proved unfit for the pipeline (the
        # stdin-fed .lds cuts failed with no usable sox error text).
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-sox

      - name: Export the MSYS2 SoX path (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          /mingw64/bin/sox --version
          echo "FLAC_CHOP_SOX=$(cygpath -w /mingw64/bin/sox.exe)" >> "$GITHUB_ENV"

      - name: Install SoX (Linux/macOS; the real-pipeline tests skip without it)
        shell: bash
        run: |
          set -eux
          case "${RUNNER_OS}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y sox libsox-fmt-all
              ;;
            macOS)
              brew install sox
              ;;
          esac
          if [ "${RUNNER_OS}" != "Windows" ]; then sox --version; fi

      - name: Build the copy-in ld-compress-ng CLI (Linux; GPU-less runner)
        # The CLI is built from the in-repo copy-in tree so the
        # accelerated-path tests exercise the real binary: the not-found
        # errors and the Auto->SoX fallback. The runner has no GPU, so the
        # required-backend tests assert the clean no-device failure and skip
        # the byte-exact assertions (lds_integration.rs ldc_device_present).
        if: runner.os == 'Linux'
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config curl \
            libogg-dev glslang-tools libvulkan-dev ocl-icd-opencl-dev
          # libFLAC 1.5.x from source: apt's 1.3.4 lacks the chained-stream
          # decoder APIs the copy-in CLI uses (MSYS2/Homebrew ship 1.5).
          scripts/ci_build_flac.sh
          cmake -S ld-compress-ng -B build-ldc -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-ldc
          ./build-ldc/ld-compress-ng --version
          echo "FLAC_CHOP_LDC=$GITHUB_WORKSPACE/build-ldc/ld-compress-ng" >> "$GITHUB_ENV"

      - name: Run cargo test
        run: cargo test --release --manifest-path core/Cargo.toml

      - name: Build probe_cli + chop_cli (smoke check)
        run: |
          cargo build --release --manifest-path core/Cargo.toml --example probe_cli
          cargo build --release --manifest-path core/Cargo.toml --example chop_cli

      - name: CLI<->GUI 1:1 parity test (offscreen)
        # The MISRC-model parity gate: the SAME binary driven through the
        # headless CLI and the real GUI event loop (FLAC_CHOP_GUI_TEST*
        # hooks) on one fixture, asserting equal probe fields, verify
        # verdicts, and byte-identical decoded audio. Linux only (the GUI
        # build needs Qt; ldc is off — the 20 MSPS fixture takes the SoX
        # path deterministically).
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -eux
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev
          cmake -S . -B build-parity -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFLAC_CHOP_BUILD_LDC=OFF
          cmake --build build-parity
          test -x build-parity/gui/flac-chop
          scripts/gui_cli_parity.sh build-parity/gui/flac-chop
