[package]
name = "flac_chop_core"
version = "0.1.0"
edition = "2021"
description = "Rust core for FLAC-Chop: FLAC STREAMINFO probe (claxon), RF MSPS math, SoX sample-exact trim cutter. Exposed as a C ABI staticlib for the Qt6 GUI."
build = "build.rs"

[lib]
name = "flac_chop_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
claxon = "0.4"
# Vorbis-comment rewriting is done by a manual FLAC metadata splice in
# src/tags.rs (no lofty): lofty 0.18's FLAC writer corrupted real cut outputs
# (frames displaced one byte past the metadata end) and panicked on
# padding-less files.

[features]
# Link libSoX statically and run the cut in-process (no external sox binary).
# The build script links libsox + deps from $SOX_STATIC_PREFIX when set.
static-sox = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
